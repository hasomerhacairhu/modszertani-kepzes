name: Audit media rebuild

on:
  push:
    branches:
      - audit/release-readiness-2026-09-26
    paths-ignore:
      - '02 Tervezet/Média-assetek/_build/**'
      - '02 Tervezet/Média-assetek/assetek.csv'
      - '02 Tervezet/Média-assetek/deliverable-ek.csv'
      - '02 Tervezet/Média-assetek/ujrahasznositas.csv'
      - '02 Tervezet/Média-assetek/Média-asset regiszter.md'
      - '02 Tervezet/Média-assetek/Média-asset regiszter.xlsx'
      - '02 Tervezet/Média-assetek/asset-migration-map.csv'
      - '02 Tervezet/Média-assetek/MEDIA-PRODUCTION-PLAN.md'
      - '02 Tervezet/Média-assetek/media-production-plan.csv'
      - '02 Tervezet/Média-assetek/ASSET-MANIFEST-V2-MIGRATION.md'

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook dependency
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Rebuild generated media outputs
        run: python tools/media_manifest.py build
      - name: Commit generated outputs
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "02 Tervezet/Média-assetek/_build"             "02 Tervezet/Média-assetek/assetek.csv"             "02 Tervezet/Média-assetek/deliverable-ek.csv"             "02 Tervezet/Média-assetek/ujrahasznositas.csv"             "02 Tervezet/Média-assetek/Média-asset regiszter.md"             "02 Tervezet/Média-assetek/Média-asset regiszter.xlsx"             "02 Tervezet/Média-assetek/asset-migration-map.csv"             "02 Tervezet/Média-assetek/MEDIA-PRODUCTION-PLAN.md"             "02 Tervezet/Média-assetek/media-production-plan.csv"             "02 Tervezet/Média-assetek/ASSET-MANIFEST-V2-MIGRATION.md"
          git commit -m "chore(media): regenerate derived registry"
          git push
