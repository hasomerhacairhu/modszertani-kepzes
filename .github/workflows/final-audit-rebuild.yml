name: Final audit generated rebuild

on:
  push:
    branches:
      - final-cleanup-2026-09-29
    paths:
      - '.github/workflows/final-audit-rebuild.yml'

permissions:
  contents: write

jobs:
  rebuild-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: |
          python -m pip install --quiet openpyxl
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc
      - name: Build generated outputs
        run: python tools/media_manifest.py build
      - name: Verify deterministic second build
        shell: bash
        run: |
          set -euo pipefail
          generated=(
            "02 Tervezet/Média-assetek/MEDIA-PRODUCTION-PLAN.md"
            "02 Tervezet/Média-assetek/media-production-plan.csv"
            "02 Tervezet/Média-assetek/_build/media-manifest.v2.json"
            "02 Tervezet/Média-assetek/assetek.csv"
            "02 Tervezet/Média-assetek/deliverable-ek.csv"
            "02 Tervezet/Média-assetek/ujrahasznositas.csv"
            "02 Tervezet/Média-assetek/Média-asset regiszter.md"
            "02 Tervezet/Média-assetek/asset-migration-map.csv"
            "02 Tervezet/Média-assetek/ASSET-MANIFEST-V2-MIGRATION.md"
            "02 Tervezet/Média-assetek/Média-asset regiszter.xlsx"
          )
          sha256sum "${generated[@]}" > /tmp/before.sha256
          python tools/media_manifest.py build
          sha256sum "${generated[@]}" > /tmp/after.sha256
          diff -u /tmp/before.sha256 /tmp/after.sha256
      - name: Full repository validation
        run: |
          python -m py_compile tools/*.py
          python -c "import json; json.load(open('.claude/settings.json', encoding='utf-8'))"
          bash -n .claude/hooks/guard-repo-safety.sh
          bash .claude/hooks/guard-repo-safety.sh --selftest
          python tools/content_integrity.py --selftest
          python tools/content_integrity.py
          python tools/content_integrity.py --release-report
          python tools/media_manifest.py --selftest
          python tools/media_manifest.py validate
          python tools/media_manifest.py check
          python tools/media_manifest.py reconcile
          python tools/media_manifest.py lint --high-only
          python -m unittest tools.test_media_manifest
          python tools/media_manifest.py stats
          git diff --check
      - name: Commit generated outputs only
        shell: bash
        run: |
          set -euo pipefail
          generated=(
            "02 Tervezet/Média-assetek/MEDIA-PRODUCTION-PLAN.md"
            "02 Tervezet/Média-assetek/media-production-plan.csv"
            "02 Tervezet/Média-assetek/_build/media-manifest.v2.json"
            "02 Tervezet/Média-assetek/assetek.csv"
            "02 Tervezet/Média-assetek/deliverable-ek.csv"
            "02 Tervezet/Média-assetek/ujrahasznositas.csv"
            "02 Tervezet/Média-assetek/Média-asset regiszter.md"
            "02 Tervezet/Média-assetek/asset-migration-map.csv"
            "02 Tervezet/Média-assetek/ASSET-MANIFEST-V2-MIGRATION.md"
            "02 Tervezet/Média-assetek/Média-asset regiszter.xlsx"
          )
          git add -- "${generated[@]}"
          if git diff --cached --quiet; then
            echo "Generated outputs already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(media): rebuild deterministic outputs"
          git push origin HEAD:final-cleanup-2026-09-29
