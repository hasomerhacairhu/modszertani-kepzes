name: Final content pass 2026-08-25

on:
  push:
    branches:
      - audit-fixes-2026-08-25
    paths:
      - tools/final_content_pass_20260825.py
      - .github/workflows/final-content-pass-20260825.yml

permissions:
  contents: write

jobs:
  final-pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-fixes-2026-08-25
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply learner-facing privacy and alignment pass
        run: python tools/final_content_pass_20260825.py
      - name: Objective integrity suite
        run: python tools/content_integrity.py
      - name: Release blocker report
        run: python tools/content_integrity.py --release-report
      - name: Commit validated output
        run: |
          git config user.name "release-audit-bot"
          git config user.email "release-audit-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: minimize learner data and complete M4 voice practice"
            git push origin HEAD:audit-fixes-2026-08-25
          fi
