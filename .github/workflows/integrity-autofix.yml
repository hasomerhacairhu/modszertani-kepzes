name: One-time integrity autofix

on:
  push:
    branches:
      - audit-fixes-2026-08-25
    paths:
      - .github/workflows/integrity-autofix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-fixes-2026-08-25
      - name: Fix objective link findings
        run: |
          python - <<'PY'
          from pathlib import Path

          old = './Modulok/M3/M3%20–%20Kvuca,%20red%20flag,%20felelősség%20–%20Csoportdinamika,%20korosztályok%20és%20gyerekvédelem.md'
          new = './Modulok/M3/M3%20–%20Kvuca,%20red%20flag,%20felelősség%20–%20Csoportdinamika,%20korosztályok%20és%20gyermekvédelem.md'
          for rel in [
              '02 Tervezet/Glosszárium – someres és pedagógiai fogalmak.md',
              '02 Tervezet/Program terv.md',
          ]:
              p = Path(rel)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Expected legacy M3 link not found in {rel}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          p = Path('tools/content_integrity.py')
          s = p.read_text(encoding='utf-8')
          old_schemes = "('http://', 'https://', 'mailto:', 'tel:', 'data:', 'javascript:')"
          new_schemes = "('http://', 'https://', 'file://', 'mailto:', 'tel:', 'data:', 'javascript:')"
          if old_schemes not in s:
              raise SystemExit('Expected URL scheme tuple not found')
          p.write_text(s.replace(old_schemes, new_schemes, 1), encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          python tools/content_integrity.py
          git config user.name "release-audit-bot"
          git config user.email "release-audit-bot@users.noreply.github.com"
          git add "02 Tervezet/Glosszárium – someres és pedagógiai fogalmak.md" "02 Tervezet/Program terv.md" tools/content_integrity.py
          git commit -m "fix: repair canonical M3 links and link audit"
          git push origin HEAD:audit-fixes-2026-08-25
