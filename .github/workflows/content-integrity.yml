name: Content integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  content-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Objective integrity checks
        run: python tools/content_integrity.py
      - name: Release blocker report
        if: always()
        run: python tools/content_integrity.py --release-report
