name: Content integrity

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  content-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checker selftest
        run: python tools/content_integrity.py --selftest
      - name: Objective integrity checks
        run: python tools/content_integrity.py
      - name: Release blocker report
        if: always()
        run: python tools/content_integrity.py --release-report

  media-manifest:
    runs-on: ubuntu-latest
    steps:
      # Full history: the content-invariant test compares the current curriculum
      # against the commit the asset migration started from. A shallow clone
      # would silently skip that test instead of running it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook dependency
        run: python -m pip install --quiet openpyxl
      - name: Baseline commit must be present
        run: |
          git cat-file -e a8629732e46eb489644dc90a624e6c8466612eda^{commit} || {
            echo "A kiindulási commit hiányzik — a tartalom-invariáns teszt nem futna le."
            exit 1
          }
      - name: Compiler selftest
        run: python tools/media_manifest.py --selftest
      - name: Manifest validation
        run: python tools/media_manifest.py validate
      - name: Generated registry is up to date
        run: python tools/media_manifest.py check
      - name: Historical row reconciliation
        run: python tools/media_manifest.py reconcile
      - name: Undeclared asset lint
        run: python tools/media_manifest.py lint --high-only
      - name: Media manifest tests
        run: python -m unittest tools.test_media_manifest
      - name: Current counts
        if: always()
        run: python tools/media_manifest.py stats



  regenerate-media-on-audit:
    if: github.event_name == 'pull_request' && github.head_ref == 'audit/release-readiness-2026-09-26'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook dependency
        run: python -m pip install --quiet openpyxl
      - name: Rebuild generated media registry
        run: python tools/media_manifest.py build
      - name: Commit generated outputs if changed
        run: |
          git add "02 Tervezet/Média-assetek/_build/media-manifest.v2.json" \
                  "02 Tervezet/Média-assetek/assetek.csv" \
                  "02 Tervezet/Média-assetek/deliverable-ek.csv" \
                  "02 Tervezet/Média-assetek/media-production-plan.csv" \
                  "02 Tervezet/Média-assetek/ujrahasznositas.csv" \
                  "02 Tervezet/Média-assetek/Média-asset regiszter.md" \
                  "02 Tervezet/Média-assetek/Média-asset regiszter.xlsx"
          if git diff --cached --quiet; then
            echo "Generated registry already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(media): rebuild generated registry after content audit"
          git push origin HEAD:"${{ github.head_ref }}"
