name: Content integrity

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  content-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m py_compile tools/*.py
      # PR: the merge commit against its base. Push: every pushed commit, not only the last.
      - name: Repository diff whitespace
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=HEAD^
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && ! printf '%s' "$BEFORE" | grep -qE '^0+$' \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$BEFORE
          fi
          git diff --check "$base" HEAD
      # CI is a read-only checker; the same allowlist runs in /release-check.
      - name: Workflows stay read-only
        run: |
          bash .github/read-only-workflows.sh --selftest
          bash .github/read-only-workflows.sh
      - name: Claude settings JSON
        run: python -m json.tool .claude/settings.json > /dev/null
      - name: Safety hooks syntax and selftest
        run: |
          bash -n .claude/hooks/guard-repo-safety.sh
          bash .claude/hooks/guard-repo-safety.sh --selftest
          bash -n .claude/hooks/review-agent-allowlist.sh
          bash .claude/hooks/review-agent-allowlist.sh --selftest
          bash -n .claude/hooks/stop-checks.sh
      - name: Checker selftest
        run: python tools/content_integrity.py --selftest
      - name: Objective integrity checks
        run: python tools/content_integrity.py
      - name: Release blocker report
        if: always()
        run: python tools/content_integrity.py --release-report

  media-manifest:
    runs-on: ubuntu-latest
    steps:
      # Full history: the content-invariant test compares the current curriculum
      # against the commit the asset migration started from. A shallow clone
      # would silently skip that test instead of running it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install workbook and render dependencies
        run: |
          python -m pip install --quiet openpyxl
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc
      - name: Baseline commit must be present
        run: |
          git cat-file -e a8629732e46eb489644dc90a624e6c8466612eda^{commit} || {
            echo "A kiindulási commit hiányzik — a tartalom-invariáns teszt nem futna le."
            exit 1
          }
      - name: Compiler selftest
        run: python tools/media_manifest.py --selftest
      - name: Manifest validation
        run: python tools/media_manifest.py validate
      - name: Generated registry is up to date
        run: python tools/media_manifest.py check
      - name: Historical row reconciliation
        run: python tools/media_manifest.py reconcile
      - name: Undeclared asset lint
        run: python tools/media_manifest.py lint --high-only
      # CLAUDE.md: the render-parity test must not stay skipped, so a skip fails CI.
      - name: Media manifest tests (no skips)
        run: |
          python -m unittest tools.test_media_manifest 2>&1 | tee unittest.log
          tail -n 1 unittest.log | grep -qx 'OK' || {
            echo "::error::A média-tesztek buktak vagy skippeltek (a Pandocnak telepítve kell lennie)."
            exit 1
          }
      - name: Current counts
        if: always()
        run: python tools/media_manifest.py stats
