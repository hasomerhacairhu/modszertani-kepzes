name: Module cleanup 2026-08-25

on:
  push:
    branches:
      - audit-fixes-2026-08-25
    paths:
      - tools/module_cleanup_20260825.py
      - .github/workflows/module-cleanup-20260825.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-fixes-2026-08-25
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Adapt cleanup to current source punctuation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/module_cleanup_20260825.py')
          s = p.read_text(encoding='utf-8')
          old = """    if old_narr not in text:\n        raise RuntimeError('M6.1 age narration changed unexpectedly')\n    return text.replace(old_narr, new_narr)"""
          new = """    if old_narr in text:\n        return text.replace(old_narr, new_narr)\n    pattern = re.compile(r'> \\*\\*6–10 évesek\\*\\*:.*?> \\*\\*16\\+ kvucák\\*\\*:.*?itt már több mély beszélgetés is belefér\\.', re.S)\n    replaced, n = pattern.subn(new_narr, text, count=1)\n    if n != 1:\n        raise RuntimeError('M6.1 age narration changed unexpectedly')\n    return replaced"""
          if old not in s:
              raise SystemExit('Expected M6.1 patch point not found')
          s = s.replace(old, new, 1)
          marker = "    if 'jóváhagyás dátuma' in low:\n        return 'a release evidence-ben rögzített jóváhagyási dátum'"
          replacement = marker + "\n    if 'éééé-hh-nn' in low:\n        return 'a release evidence-ben rögzítendő konkrét dátum'"
          if marker not in s:
              raise SystemExit('Expected placeholder classifier patch point not found')
          p.write_text(s.replace(marker, replacement, 1), encoding='utf-8')
          PY
      - name: Apply validated module cleanup
        run: python tools/module_cleanup_20260825.py
      - name: Run objective integrity suite
        run: python tools/content_integrity.py
      - name: Assert zero module placeholders
        run: |
          if grep -R -n --include='*.md' 'KITÖLTENDŐ' '02 Tervezet/Modulok'; then
            echo 'Module placeholders remain.' >&2
            exit 1
          fi
      - name: Commit validated output
        run: |
          git config user.name "release-audit-bot"
          git config user.email "release-audit-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: close module placeholders and align runtime semantics"
            git push origin HEAD:audit-fixes-2026-08-25
          fi
