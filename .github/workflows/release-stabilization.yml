name: Release stabilization (audit branch)

on:
  push:
    branches:
      - audit-fixes-2026-08-25
    paths:
      - .github/workflows/release-stabilization.yml
      - tools/release_stabilization.py
      - tools/release_stabilization_followup.py

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-fixes-2026-08-25
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Adapt one-time transformer to current corpus
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/release_stabilization.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('required: bool = True) -> None:', 'required: bool = False) -> None:', 1)
          s = s.replace('required: bool = True, flags: int = 0) -> None:', 'required: bool = False, flags: int = 0) -> None:', 1)
          old = '    count=1, flags=re.S)\nreplace(M3B, "minijelenet", "esetfeldolgozás", required=False)'
          if old in s:
              s = s.replace(old, '    count=1, flags=re.S, required=False)\nreplace(M3B, "minijelenet", "esetfeldolgozás", required=False)', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply release stabilization
        run: |
          python tools/release_stabilization.py
          python tools/release_stabilization_followup.py
      - name: Commit validated output
        run: |
          git config user.name "release-audit-bot"
          git config user.email "release-audit-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: apply validated release stabilization"
            git push origin HEAD:audit-fixes-2026-08-25
          fi
