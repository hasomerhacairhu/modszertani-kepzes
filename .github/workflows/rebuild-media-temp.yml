name: Temporary media rebuild

on:
  push:
    branches:
      - audit/release-readiness-2026-09-26

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/release-readiness-2026-09-26
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook dependency
        run: python -m pip install --quiet openpyxl
      - name: Rebuild generated media outputs
        run: python tools/media_manifest.py build
      - name: Commit generated outputs
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "02 Tervezet/Média-assetek"
          git commit -m "chore(media): rebuild generated registry after audit fixes"
          git push origin HEAD:audit/release-readiness-2026-09-26
