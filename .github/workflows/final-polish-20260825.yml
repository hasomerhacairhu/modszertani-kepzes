name: Final polish 2026-08-25

on:
  push:
    branches:
      - audit-fixes-2026-08-25
    paths:
      - tools/final_polish_20260825.py
      - .github/workflows/final-polish-20260825.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-fixes-2026-08-25
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/final_polish_20260825.py
      - run: python tools/content_integrity.py
      - name: Commit validated output
        run: |
          git config user.name "release-audit-bot"
          git config user.email "release-audit-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: polish M7 numbering and Study Lab privacy remnants"
            git push origin HEAD:audit-fixes-2026-08-25
          fi
