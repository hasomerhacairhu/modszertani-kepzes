name: Precleanup backup bundle

on:
  push:
    branches:
      - final-cleanup-2026-09-29

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch every branch and tag ref
        run: |
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'

      - name: Create and verify precleanup bundle
        run: |
          set -euo pipefail
          mkdir -p precleanup-backup
          git show-ref | sort > precleanup-backup/ref-manifest-runner.txt
          git fsck --full 2>&1 | tee precleanup-backup/git-fsck.txt
          git bundle create precleanup-backup/modszertani-kepzes-precleanup.bundle --all
          git bundle verify precleanup-backup/modszertani-kepzes-precleanup.bundle 2>&1 | tee precleanup-backup/bundle-verify.txt
          git bundle list-heads precleanup-backup/modszertani-kepzes-precleanup.bundle | sort | tee precleanup-backup/bundle-heads.txt
          sha256sum precleanup-backup/modszertani-kepzes-precleanup.bundle > precleanup-backup/bundle.sha256

      - name: Upload verified backup
        uses: actions/upload-artifact@v7
        with:
          name: modszertani-kepzes-precleanup-backup
          path: precleanup-backup/
          if-no-files-found: error
          retention-days: 30
